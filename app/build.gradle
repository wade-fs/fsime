plugins {
    id('com.android.application')
}

android {
    signingConfigs {
        release {
            keyAlias = System.getenv("SIGNING_KEY_ALIAS") ?: 'androidapk'
            keyPassword = System.getenv("SIGNING_KEY_PASSWORD") ?: 'jjchen'
            def keyFile = System.getenv("SIGNING_KEY_FILE")
            storeFile = keyFile != null ? file(keyFile) : file('/home/wade/.ssh/androidapk.jks')
            storePassword = System.getenv("SIGNING_STORE_PASSWORD") ?: 'jjchen'
        }
    }
    compileSdk = 35
    defaultConfig {
        applicationId = "com.wade.fsime"
        minSdkVersion = 33
        targetSdkVersion = 35
        versionCode = 260608
        versionName = "v1.3.2"
    }
    buildTypes {
       release {
           minifyEnabled = true
           shrinkResources = true
           signingConfig = signingConfigs.release
           proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
       }
    }
    namespace = 'com.wade.fsime'
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    androidResources {
        ignoreAssetsPattern = '*.cmd:*.cmdr'
    }
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

base {
    archivesName = "com.wade.fsime-${android.defaultConfig.versionName}"
}

dependencies {
    implementation('com.google.android.material:material:1.12.0')
    implementation('com.readystatesoftware.sqliteasset:sqliteassethelper:2.0.1')
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.mlkit:digital-ink-recognition:18.1.0'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'

    // CameraX
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ML Kit Text Recognition (Chinese)
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'

    // ML Kit Barcode Scanning
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
